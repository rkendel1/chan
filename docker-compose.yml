# NOTE: If you see warnings like "pull access denied for chandra-api" or "pull access denied for chandra-vllm",
# this is normal! These are local images that need to be built first.
# Docker tries to pull from a registry before building. Run 'docker-compose build' to build the images.

services:
  # Default: Chandra API with HuggingFace backend (CPU-only, no GPU required)
  # This is the default service that starts when you run 'docker-compose up'
  chandra-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chandra-api:cached
    container_name: chandra-api
    ports:
      - "5000:5000"
    environment:
      - INFERENCE_METHOD=hf
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=5000
    restart: on-failure:3  # Retry up to 3 times on crashes, then stop to prevent infinite restart loop
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # GPU Mode: vLLM server with NVIDIA GPU (requires NVIDIA Container Toolkit)
  # Start with: docker-compose --profile gpu up
  vllm-server:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: chandra-vllm:cached
    container_name: chandra-vllm
    ports:
      - "8000:8000"
    environment:
      - VLLM_MODEL_NAME=chandra
    # Model is pre-cached in the image (~20GB included in build)
    # No volume mount needed - startup is immediate
    command: >
      --model datalab-to/chandra-ocr-2
      --served-model-name chandra
      --host 0.0.0.0
      --port 8000
      --max-model-len 16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: on-failure:3  # Retry up to 3 times on crashes, then stop to prevent infinite restart loop
    profiles:
      - gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2 minutes to load pre-cached model into memory

  # GPU Mode: Chandra API using vLLM backend
  # Start with: docker-compose --profile gpu up
  chandra-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: chandra-api:cached
    container_name: chandra-api-vllm
    ports:
      - "5000:5000"
    environment:
      - INFERENCE_METHOD=vllm
      - VLLM_API_BASE=http://vllm-server:8000/v1
      - VLLM_MODEL_NAME=chandra
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=5000
    depends_on:
      vllm-server:
        condition: service_healthy
    restart: on-failure:3  # Retry up to 3 times on crashes, then stop to prevent infinite restart loop
    profiles:
      - gpu
    # Model is pre-cached in the image - no download needed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

